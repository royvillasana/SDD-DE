name: Deploy site to GitHub Pages

# The site is also deployed to Vercel (site-omega-red-44.vercel.app).
# This workflow publishes the same static site/ directory to GitHub Pages
# at https://royvillasana.github.io/SDD-DE/ — the two are independent.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The pages embed their JS as gzipped virtual assets; editing the sibling
      # .js file alone leaves the rendered page stale. Fail loudly if they drift.
      - name: Check embedded bundles are current
        run: python3 site/rebundle.py --check

      # The hero badge is hardcoded; catch it drifting from package.json.
      - name: Check version badge matches package.json
        run: python3 site/sync-version.py --check

      # site/ is plain static HTML/JS/SVG — no build step. content/ holds the
      # markdown sources already rendered into docs-data.js, so it is excluded
      # from what gets served.
      - name: Stage site
        run: |
          mkdir -p _pages
          rsync -a --exclude 'content/' site/ _pages/
          touch _pages/.nojekyll
          ls -la _pages

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages
          # v5 defaults this to false, which would silently drop .nojekyll.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
